name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test visualization
        run: |
          python -m chemviz html -o smoke.html
          python -m chemviz mass "Ca(OH)2"
          python -m chemviz balance "Fe + O2 = Fe3O4"
          python -c "print(open('smoke.html', encoding='utf-8').read().count('原子结构示意图'))"
